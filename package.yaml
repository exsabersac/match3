name:                match3
version:             0.1.0.0
github:              "exsabersac/match3"
license:             BSD-3-Clause
author:              "yu binbin"
maintainer:          "exsabersac"
copyright:           "2026 yu binbin"

extra-source-files:
- README.md

description:        Playable Haskell 2D Match-3 (消消乐) with SDL2

dependencies:
- base >= 4.7 && < 5
- array
- random

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - containers
  exposed-modules:
  - Engine.Game
  - Engine.Effect
  - Engine.Playback
  - Engine.History
  - Match3.Core
  - Match3.Engine
  - Match3.Types
  - Match3.Types.Name
  - Match3.Types.Cell
  - Match3.Types.Overlay
  - Match3.Types.Body
  - Match3.Types.Board
  - Match3.Types.Game
  - Match3.Levels.Level
  - Match3.Levels.Campaign
  - Match3.Color
  - Match3.Counts
  - Match3.Goal
  - Match3.Board.Grid
  - Match3.Board.Match
  - Match3.Board.Clear
  - Match3.Board.Gravity
  - Match3.Board.Hooks
  - Match3.Board.Cascade
  - Match3.Board.Random
  - Match3.Board.Default
  - Match3.Game.State
  - Match3.Game.Tally
  - Match3.Game.Outcome
  - Match3.Game.Shuffle
  - Match3.Game.Level
  - Match3.Game.Trace
  - Match3.Game.Resolve
  - Match3.Game.Move
  - Match3.Game.Boosters
  - Match3.Obstacles
  - Match3.Rainbow
  - Match3.Combos
  - Match3.Ice
  - Match3.Daily
  - Match3.Countdown
  - Match3.Conveyor
  - Match3.Boosters
  - Match3.Grass
  - Match3.Ufo
  - Match3.Snail
  - Match3.Carpet
  - Match3.Element
  - Match3.Element.Types
  - Match3.Element.Registry
  - Match3.Element.Builtin
  - Match3.Element.Builtin.Common
  - Match3.Element.Builtin.Gem
  - Match3.Element.Builtin.Layer
  - Match3.Element.Builtin.Obstacle
  - Match3.Element.Builtin.Collectible
  - Match3.Element.Builtin.Actor
  - Match3.Element.Builtin.Ground
  - Match3.Element.Builtin.Level
  - Match3.Element.Event
  - Match3.Element.Class
  - Match3.Element.Message
  - Match3.Element.Level

executables:
  match3-sdl:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wno-partial-fields
    dependencies:
    - match3
    - sdl2
    - text
    - containers
    - directory
    - filepath

tests:
  match3-test:
    main:                Spec.hs
    source-dirs:
    - test
    - test/golden
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - match3
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - directory
