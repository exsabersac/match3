name:                match3
version:             0.1.0.0
github:              "exsabersac/match3"
license:             BSD-3-Clause
author:              "yu binbin"
maintainer:          "exsabersac"
copyright:           "2026 yu binbin"

extra-source-files:
- README.md

description:        Playable Haskell 2D Match-3 (消消乐) with SDL2

dependencies:
- base >= 4.7 && < 5
- random

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - array
  - containers
  - transformers
  exposed-modules:
  - Engine.Game
  - Engine.Effect
  - Engine.Playback
  - Engine.Stream
  - Engine.Optics
  - Engine.History
  - Engine.GridUI
  - Match3.Core
  - Match3.Engine
  - Match3.View
  - Match3.Types
  - Match3.Types.Name
  - Match3.Types.Cell
  - Match3.Types.Overlay
  - Match3.Types.Optics
  - Match3.Types.Body
  - Match3.Types.Board
  - Match3.Types.Game
  - Match3.Levels.Level
  - Match3.Levels.Campaign
  - Match3.Color
  - Match3.Counts
  - Match3.Goal
  - Match3.GoalLabel
  - Match3.Board.Grid
  - Match3.Board.Match
  - Match3.Board.Clear
  - Match3.Board.Gravity
  - Match3.Board.Hooks
  - Match3.Board.Refill
  - Match3.Board.Phase
  - Match3.Board.Wave
  - Match3.Board.Effect
  - Match3.Board.Cascade
  - Match3.Board.Random
  - Match3.Board.Default
  - Match3.Game.State
  - Match3.Game.Tally
  - Match3.Game.Outcome
  - Match3.Game.Shuffle
  - Match3.Game.Level
  - Match3.Game.Trace
  - Match3.Game.EndPhase
  - Match3.Game.Resolve
  - Match3.Game.Move
  - Match3.Game.Boosters
  - Match3.Obstacles
  - Match3.Rainbow
  - Match3.Combos
  - Match3.Ice
  - Match3.Daily
  - Match3.Countdown
  - Match3.Conveyor
  - Match3.Boosters
  - Match3.Grass
  - Match3.Ufo
  - Match3.Snail
  - Match3.Carpet
  - Match3.Element
  - Match3.Element.Types
  - Match3.Element.Rules
  - Match3.Element.Special
  - Match3.Element.Builtin
  - Match3.Element.Builtin.Common
  - Match3.Element.Builtin.Gem
  - Match3.Element.Builtin.Layer
  - Match3.Element.Builtin.Obstacle
  - Match3.Element.Builtin.Collectible
  - Match3.Element.Builtin.Actor
  - Match3.Element.Builtin.Ground
  - Match3.Element.Builtin.Level
  - Match3.Element.Event
  - Match3.Element.Class
  - Match3.Element.Ability
  - Match3.Element.Kind
  - Match3.Element.Layer
  - Match3.Element.World
  - Match3.Element.Message
  - Match3.Element.Level

# 桌面前端的纯模块（不依赖 SDL）：可执行文件经这个内部库用；测试套件直接编译 app/pure 源码（它也直接编译 src，
# 若经内部库用，内部库里的 Match3.* 类型来自 match3 库、与测试自己编译的 src 不是同一类型）；
# 网页 web/match3-web.cabal 按源码编其中用到的几个（web/build.sh 检查它们都在这张清单里）。
internal-libraries:
  match3-pure:
    source-dirs: app/pure
    dependencies:
    - match3
    exposed-modules:
    - ComboFx
    - UI.CellFace
    - UI.GoalIcon
    - UI.MoveText
    - UI.Palette
    - UI.Presentation
    - UI.Sound
    - UI.WebMeta

executables:
  match3-sdl:
    main:                Main.hs
    source-dirs:
    - app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - match3
    - match3-pure
    - sdl2
    - text
    - containers
    - directory
    - filepath
    - bytestring
    - vector

tests:
  match3-test:
    main:                Spec.hs
    source-dirs:
    - test
    - test/golden
    - app/pure
    - src
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - array
    - containers
    - transformers
    - stm
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - directory
