name:                match3
version:             0.1.0.0
github:              "exsabersac/match3"
license:             BSD-3-Clause
author:              "yu binbin"
maintainer:          "exsabersac"
copyright:           "2026 yu binbin"

extra-source-files:
- README.md

description:        Playable Haskell 2D Match-3 (消消乐) with SDL2

dependencies:
- base >= 4.7 && < 5
- array
- random

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
  - Match3.Core
  - Match3.Types
  - Match3.Board
  - Match3.Game
  - Match3.Obstacles
  - Match3.Rainbow
  - Match3.Combos
  - Match3.Ice
  - Match3.Daily
  - Match3.Countdown
  - Match3.Conveyor
  - Match3.Boosters
  - Match3.Grass
  - Match3.Ufo

executables:
  match3-sdl:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wno-partial-fields
    dependencies:
    - match3
    - sdl2
    - text

tests:
  match3-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - match3
    - tasty
    - tasty-hunit
    - tasty-quickcheck
