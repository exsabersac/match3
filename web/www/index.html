<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover：画到刘海 / 圆角区域之下，安全区由布局按 env(safe-area-inset-*) 让开；禁止缩放 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>三消 · Haskell 核心跑在浏览器里（GHC wasm）</title>
<style>
  /* 整页只有一张铺满视口的画布：棋盘、HUD、按钮都画在上面，按可用空间自适应（见 layout.js） */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1630;
               overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #board { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #ddd;
             font: 16px system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="board"></canvas>
<div id="loading">加载中…</div>
<script type="module">
  import("./main.js").then(() => document.getElementById("loading").remove())
    .catch((e) => { document.getElementById("loading").textContent = "加载失败：" + e.message; console.error(e); });
</script>
</body>
</html>
