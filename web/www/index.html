<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Match-3 网页版 spike（Haskell → wasm）</title>
<style>
  /* 只做最小样式：彩色方块 + 简单 HUD，不追求美术 */
  body { margin: 0; font-family: system-ui, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
         background: #20242c; color: #eee; display: flex; justify-content: center; }
  #app { padding: 16px; width: 480px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #hud { display: flex; gap: 16px; font-size: 16px; margin: 8px 0; flex-wrap: wrap; }
  #hud b { color: #ffd54f; }
  #board { display: block; background: #2e3440; border-radius: 8px; touch-action: none; cursor: pointer; }
  #msg { min-height: 24px; margin: 8px 0; font-size: 16px; }
  #controls { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  button, select { font-size: 14px; padding: 4px 10px; }
  #perf { font-size: 12px; color: #9aa; white-space: pre-line; }
  #overlay { position: absolute; display: none; background: rgba(0,0,0,.72); color: #fff; font-size: 26px;
             text-align: center; border-radius: 8px; align-items: center; justify-content: center; flex-direction: column; }
  #overlay small { font-size: 15px; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <h1>三消 · Haskell 核心跑在浏览器里（GHC wasm spike）</h1>
  <div id="controls">
    <select id="level"></select>
    <button id="restart">重新开始</button>
    <button id="hintBtn">提示</button>
    <button id="undoBtn">撤销</button>
  </div>
  <div id="hud">
    <span>关卡 <b id="lv">-</b></span>
    <span>分数 <b id="score">0</b></span>
    <span>剩余步数 <b id="moves">0</b></span>
    <span>目标 <b id="goal">-</b></span>
  </div>
  <div style="position:relative">
    <canvas id="board"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="msg">加载 wasm 中…</div>
  <div id="perf"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
